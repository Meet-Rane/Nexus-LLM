spring.application.name=sovereign-ai-workbench

spring.config.import=optional:file:./local.properties

server.port=${PORT:8090}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
 
ai.provider=${AI_PROVIDER:ollama}

spring.ai.openai.api-key=${AI_KEY:none}
spring.ai.openai.base-url=https://integrate.api.nvidia.com/v1
spring.ai.openai.chat.model=${AI_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}

ai.coding.model=${AI_CODING_MODEL:qwen2.5-coder:7b}
ai.general.model=${AI_GENERAL_MODEL:llama3.1:8b}
ai.reasoning.model=${AI_REASONING_MODEL:deepseek-r1:8b}

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.1:8b}

spring.ai.openai.chat.max-tokens=10000
spring.ai.openai.client.read-timeout=300s
spring.ai.openai.client.connect-timeout=60s
spring.ai.openai.read-timeout=300s
spring.ai.openai.connect-timeout=60s

spring.ai.model.embedding=none

logging.level.org.springframework.ai.openai=DEBUG
logging.level.com.openai=DEBUG

spring.ai.chat.memory.repository.jdbc.initialize-schema=always

sandbox.docker.command=${DOCKER_PATH:docker}
sandbox.artifact-storage=storage/artifacts
sandbox.timeout-seconds=30

app.jwt.secret=${JWT_SECRET:sovereignaiworkbenchsecretkeyforjwtauthentication2026!}
app.jwt.expirationMs=86400000