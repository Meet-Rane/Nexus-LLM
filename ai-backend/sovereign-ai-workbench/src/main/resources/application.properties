spring.application.name=sovereign-ai-workbench

spring.config.import=optional:file:./local.properties

server.port=${PORT:8090}

spring.datasource.url=${DB_URL:jdbc:h2:file:./storage/nexus-db;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
 
ai.provider=${AI_PROVIDER:ollama}
sovereign.enforce-local-only=${SOVEREIGN_ENFORCE_LOCAL_ONLY:true}

spring.ai.openai.api-key=${AI_KEY:local-provider-not-configured}

spring.ai.openai.base-url=${AI_BASE_URL:https://integrate.api.nvidia.com/v1}
spring.ai.openai.chat.model=${AI_MODEL:nvidia/nemotron-3.5-lightning-30b-a3b}
ai.coding.model=${AI_CODING_MODEL:${OLLAMA_MODEL:llama3.2:1b}}
ai.general.model=${AI_GENERAL_MODEL:${OLLAMA_MODEL:llama3.2:1b}}
ai.reasoning.model=${AI_REASONING_MODEL:${AI_GENERAL_MODEL:${OLLAMA_MODEL:llama3.2:1b}}}
ai.router.llm-fallback=${AI_ROUTER_LLM_FALLBACK:false}
ai.ollama.num-predict=${OLLAMA_NUM_PREDICT:1600}
ai.ollama.num-ctx=${OLLAMA_NUM_CTX:4096}
ai.ollama.keep-alive=${OLLAMA_KEEP_ALIVE:10m}
ai.ollama.temperature=${OLLAMA_TEMPERATURE:0.1}

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:llama3.2:1b}

spring.ai.openai.chat.max-tokens=10000
spring.ai.openai.client.read-timeout=300s
spring.ai.openai.client.connect-timeout=60s
spring.ai.openai.read-timeout=300s
spring.ai.openai.connect-timeout=60s

spring.ai.model.embedding=none

# Avoid logging confidential prompts or model payloads in production-style local runs.
logging.level.org.springframework.ai.openai=WARN
logging.level.com.openai=WARN

spring.ai.chat.memory.repository.jdbc.initialize-schema=always

sandbox.docker.command=${DOCKER_PATH:docker}
sandbox.network-disabled=true
rag.service.base-url=${RAG_BASE_URL:http://localhost:8001}

sandbox.artifact-storage=storage/artifacts
sandbox.timeout-seconds=30

app.jwt.secret=${JWT_SECRET:bmV4dXMtc292ZXJlaWduLWFpLXdvcmtbenchLWRldi1zZWNyZXQta2V5LTIwMjY=}
app.jwt.expirationMs=86400000
